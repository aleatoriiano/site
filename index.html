<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roda de Times — Futebol & Artilheiros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f0d;
      --bg-card: #121a16;
      --accent: #22c55e;
      --text: #ecfdf5;
      --text-muted: #94a3b8;
      --border: rgba(34, 197, 94, 0.25);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      background: radial-gradient(ellipse 120% 80% at 50% -20%, #14532d 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    .hero-header {
      margin-bottom: 1.5rem;
    }

    header.site-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
    }

    header.site-header h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(2.4rem, 7vw, 3.8rem);
      letter-spacing: 0.06em;
      color: var(--text);
      text-shadow: 0 0 40px rgba(34, 197, 94, 0.35);
    }

    .logo-site {
      width: clamp(56px, 12vw, 84px);
      height: clamp(56px, 12vw, 84px);
      object-fit: cover;
      border-radius: 18px;
      border: 2px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    .wheel-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 0.75rem 1.5rem;
      margin-bottom: 2rem;
    }

    .panel-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 1rem;
      font-weight: 600;
      text-align: center;
    }

    .wheel-stage {
      position: relative;
      width: min(92vw, 720px);
      height: min(92vw, 720px);
      max-width: 100%;
      margin: 0 auto;
    }

    .wheel {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(34, 197, 94, 0.08) 0%, transparent 42%),
        radial-gradient(circle at center, transparent 38%, rgba(34, 197, 94, 0.06) 39%, transparent 55%);
    }

    .wheel-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42%;
      max-width: 280px;
    }

    .wheel-center .scorer-card {
      width: 100%;
      max-width: none;
    }

    .team-slot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--slot-size, 64px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 0.15rem;
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--radius) * -1)) rotate(calc(var(--angle) * -1));
      transform-origin: center center;
      cursor: pointer;
      z-index: 3;
      transition: transform 0.25s ease, z-index 0s;
    }

    .team-slot:hover {
      z-index: 10;
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--radius) * -1)) rotate(calc(var(--angle) * -1)) scale(1.45);
    }

    .team-titles {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.12em;
      line-height: 1;
      min-height: calc(var(--slot-size, 64px) * 0.38);
      transition: transform 0.25s ease;
    }

    .titles-count {
      font-family: "Bebas Neue", sans-serif;
      font-size: calc(var(--slot-size, 64px) * 0.32);
      font-weight: 400;
      color: #facc15;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      transition: font-size 0.25s ease;
    }

    .trophy {
      width: calc(var(--slot-size, 64px) * 0.36);
      height: calc(var(--slot-size, 64px) * 0.36);
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      transition: width 0.25s ease, height 0.25s ease;
    }

    .team-shield {
      width: var(--slot-size, 64px);
      height: var(--slot-size, 64px);
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
      transition: width 0.25s ease, height 0.25s ease;
    }

    .scorer-card {
      position: relative;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      aspect-ratio: 3 / 4.2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .scorer-card.featured {
      max-width: 340px;
      aspect-ratio: 3 / 4.1;
    }

    .scorer-card-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12% 10% 14%;
      text-align: center;
    }

    .scorer-card.featured .scorer-card-inner {
      padding: 11% 9% 13%;
    }

    .teams-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
      min-height: 2rem;
    }

    .team-shield-wrap {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }

    .team-stint-count {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -35%);
      z-index: 1;
      font-family: "Bebas Neue", sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      color: #facc15;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
      line-height: 1;
      pointer-events: none;
    }

    .teams-row img {
      object-fit: contain;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.2);
    }

    .teams-row.count-1 img {
      width: 44px;
      height: 44px;
    }

    .teams-row.count-2 img {
      width: 36px;
      height: 36px;
    }

    .teams-row.count-3 img,
    .teams-row.count-4 img {
      width: 28px;
      height: 28px;
    }

    .teams-row.count-5 img,
    .teams-row.count-more img {
      width: 22px;
      height: 22px;
    }

    .teams-row.count-3 .team-stint-count,
    .teams-row.count-4 .team-stint-count,
    .teams-row.count-5 .team-stint-count,
    .teams-row.count-more .team-stint-count {
      font-size: 0.65rem;
    }

    .profile-pic {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      margin-bottom: 0.5rem;
    }

    .scorer-card.featured .profile-pic {
      width: 96px;
      height: 96px;
      border-width: 4px;
    }

    .wheel-center .scorer-card.featured .profile-pic {
      width: clamp(48px, 12vw, 80px);
      height: clamp(48px, 12vw, 80px);
    }

    .wheel-center .scorer-card.featured .scorer-name {
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
    }

    .wheel-center .scorer-card.featured .scorer-level {
      font-size: clamp(0.7rem, 2vw, 0.85rem);
    }

    .wheel-center .teams-row.count-1 img {
      width: clamp(28px, 7vw, 40px);
      height: clamp(28px, 7vw, 40px);
    }

    .scorer-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }

    .scorer-card.featured .scorer-name {
      font-size: 1.25rem;
    }

    .scorer-level {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fef08a;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.04em;
    }

    .scorer-card.featured .scorer-level {
      font-size: 0.95rem;
    }

    .section-below {
      margin-top: 0;
    }

    .section-below.panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .section-below .panel-title {
      margin-bottom: 1rem;
    }

    .artilheiros-scroll {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
      justify-items: center;
    }

    @media (max-width: 600px) {
      .artilheiros-scroll {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }

      .wheel-stage {
        width: min(96vw, 520px);
        height: min(96vw, 520px);
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero-header">
      <header class="site-header">
        <h1>AlehFut</h1>
        <img class="logo-site" src="outros/icone.png" alt="Ícone Roda de Times" width="96" height="96" />
      </header>
    </div>

    <div class="wheel-panel">
      <div class="wheel-stage" id="wheelStage">
        <div class="wheel" id="teamWheel"></div>
        <div class="wheel-center" id="featuredScorer"></div>
      </div>
    </div>

    <div class="section-below panel">
      <div class="panel-title">Demais artilheiros</div>
      <div class="artilheiros-scroll" id="otherScorers"></div>
    </div>
  </div>

  <script src="times.js"></script>
  <script src="artilheiros.js"></script>
  <script>
    (function () {
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }

      /** Nível 1–20: um card por nível (cards/1.png … cards/20.png). Valores fora do intervalo viram 1 ou 20. */
      function cardImageForLevel(level) {
        var n = Math.floor(Number(level));
        if (!isFinite(n) || n < 1) n = 1;
        if (n > 20) n = 20;
        return "cards/" + n + ".png";
      }

      function teamsRowClass(count) {
        if (count <= 1) return "count-1";
        if (count === 2) return "count-2";
        if (count <= 4) return "count-" + count;
        if (count === 5) return "count-5";
        return "count-more";
      }

      /** Agrupa escudos repetidos; mantém ordem da primeira aparição. */
      function groupScorerTeams(teams) {
        var order = [];
        var counts = Object.create(null);
        teams.forEach(function (t) {
          if (!counts[t]) {
            counts[t] = 0;
            order.push(t);
          }
          counts[t]++;
        });
        return order.map(function (t) {
          return { file: t, count: counts[t] };
        });
      }

      function buildScorerCard(a, featured) {
        var foto = a.foto || "";
        var cardBg = cardImageForLevel(a.level);
        var groupedTeams = groupScorerTeams(a.teams);
        var rowClass = teamsRowClass(groupedTeams.length);
        var div = document.createElement("div");
        div.className = "scorer-card" + (featured ? " featured" : "");
        div.style.backgroundImage = "url('" + esc(cardBg).replace(/'/g, "\\'") + "')";
        var inner = document.createElement("div");
        inner.className = "scorer-card-inner";
        var row = document.createElement("div");
        row.className = "teams-row " + rowClass;
        groupedTeams.forEach(function (item) {
          var wrap = document.createElement("div");
          wrap.className = "team-shield-wrap";
          if (item.count > 1) {
            var badge = document.createElement("span");
            badge.className = "team-stint-count";
            badge.textContent = item.count + "x";
            wrap.appendChild(badge);
          }
          var img = document.createElement("img");
          img.src = "escudos/" + item.file;
          img.alt = "";
          wrap.appendChild(img);
          row.appendChild(wrap);
        });
        inner.appendChild(row);
        var profile = document.createElement("img");
        profile.className = "profile-pic";
        profile.src = foto;
        profile.alt = a.name;
        inner.appendChild(profile);
        var nameEl = document.createElement("div");
        nameEl.className = "scorer-name";
        nameEl.textContent = a.name;
        inner.appendChild(nameEl);
        var lvl = document.createElement("div");
        lvl.className = "scorer-level";
        lvl.textContent = "Nível " + a.level;
        inner.appendChild(lvl);
        div.appendChild(inner);
        return div;
      }

      function wheelMetrics(n, stageSize) {
        var centerRatio = 0.42;
        var centerHalf = (stageSize * centerRatio) / 2;
        var padding = stageSize * 0.04;
        var maxRadius = stageSize / 2 - padding;

        if (n <= 0) {
          return { slot: 48, radius: maxRadius * 0.72 };
        }

        var slot = Math.min(88, Math.max(28, (stageSize * 0.95) / (n * 0.42 + 2.2)));
        var minRadius = centerHalf + slot * 0.85;
        var byCircumference = (n * slot * 1.15) / (2 * Math.PI);
        var radius = Math.min(maxRadius - slot * 0.55, Math.max(minRadius, byCircumference));

        if (radius + slot * 0.55 > maxRadius) {
          slot = Math.max(24, (maxRadius - minRadius + slot * 0.55) * 0.9);
          radius = Math.min(maxRadius - slot * 0.55, Math.max(minRadius, (n * slot * 1.15) / (2 * Math.PI)));
        }

        return { slot: Math.round(slot), radius: Math.round(radius) };
      }

      function renderWheel() {
        var wheel = document.getElementById("teamWheel");
        var stage = document.getElementById("wheelStage");
        var teams = TEAMS.slice();
        var n = teams.length;
        var size = Math.min(stage.clientWidth, stage.clientHeight) || 600;
        var metrics = wheelMetrics(n, size);

        wheel.innerHTML = "";
        wheel.style.setProperty("--slot-size", metrics.slot + "px");

        teams.forEach(function (t, i) {
          var angle = n === 1 ? 0 : (360 / n) * i - 90;
          var slot = document.createElement("div");
          slot.className = "team-slot";
          slot.style.setProperty("--angle", angle + "deg");
          slot.style.setProperty("--radius", metrics.radius + "px");
          slot.style.setProperty("--slot-size", metrics.slot + "px");
          slot.title = t.name || "";

          if (Number(t.titles) > 0) {
            var titles = document.createElement("div");
            titles.className = "team-titles";
            var count = document.createElement("span");
            count.className = "titles-count";
            count.textContent = t.titles + "x";
            var trophy = document.createElement("img");
            trophy.className = "trophy";
            trophy.src = "outros/trofeu.png";
            trophy.alt = "";
            titles.appendChild(count);
            titles.appendChild(trophy);
            slot.appendChild(titles);
          }

          var shield = document.createElement("img");
          shield.className = "team-shield";
          shield.src = "escudos/" + t.shield;
          shield.alt = "";
          slot.appendChild(shield);
          wheel.appendChild(slot);
        });
      }

      function renderScorers() {
        var featured = document.getElementById("featuredScorer");
        var other = document.getElementById("otherScorers");
        featured.innerHTML = "";
        other.innerHTML = "";

        var sorted = ARTILHEIROS.slice().sort(function (a, b) {
          return b.level - a.level;
        });
        if (!sorted.length) return;

        featured.appendChild(buildScorerCard(sorted[0], true));
        sorted.slice(1).forEach(function (a) {
          other.appendChild(buildScorerCard(a, false));
        });
      }

      function render() {
        renderWheel();
        renderScorers();
      }

      var resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderWheel, 120);
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", render);
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
